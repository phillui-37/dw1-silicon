name: build

# Runs on the project's own machine (a self-hosted Windows runner), not GitHub-hosted
# runners. The machine already carries the toolchain this project needs; the job only
# puts scoop's LLVM bin on PATH (Clang is the C compiler for the game code, and its
# libclang serves bindgen) and Python's PyYAML, then builds and tests.
on:
  push:
    branches: [windows-port, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: windows (${{ matrix.version }})
    runs-on: [self-hosted, windows]
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        version: [us, jp_rev1]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\scoop\apps\llvm\current\bin;" + $env:PATH
          $env:LIBCLANG_PATH = "$env:USERPROFILE\scoop\apps\llvm\current\bin"
          "PATH={0}" -f $env:PATH | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBCLANG_PATH={0}" -f $env:LIBCLANG_PATH | Out-File -FilePath $env:GITHUB_ENV -Append
          rustc --version
          cargo --version
          clang --version
          python --version

      - name: Build (${{ matrix.version }})
        env:
          DW1_VERSION: ${{ matrix.version }}
        run: cargo build --workspace --release

      - name: Test (${{ matrix.version }})
        env:
          DW1_VERSION: ${{ matrix.version }}
        run: cargo test --workspace
