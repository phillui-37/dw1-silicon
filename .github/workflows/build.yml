name: build

# Runs on the project's own machines, not GitHub-hosted runners:
# - windows: this PC's self-hosted runners (phils-pc-win / phils-pc-win-b)
# - linux: the WSL podman-machine's self-hosted runner (phils-pc-linux), which carries
#   the full toolchain (rustup nightly, clang, SDL3 build deps, Vulkan loader).
on:
  push:
    branches: [windows-port, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: windows (${{ matrix.version }})
    runs-on: [self-hosted, windows]
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        version: [us, jp_rev1]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\scoop\apps\llvm\current\bin;" + $env:PATH
          $env:LIBCLANG_PATH = "$env:USERPROFILE\scoop\apps\llvm\current\bin"
          "PATH={0}" -f $env:PATH | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBCLANG_PATH={0}" -f $env:LIBCLANG_PATH | Out-File -FilePath $env:GITHUB_ENV -Append
          rustc --version
          cargo --version
          clang --version
          python --version

      - name: Build (${{ matrix.version }})
        env:
          DW1_VERSION: ${{ matrix.version }}
        run: cargo build --workspace --release

      - name: Test (${{ matrix.version }})
        env:
          DW1_VERSION: ${{ matrix.version }}
        run: cargo test --workspace

  build-linux:
    name: linux (${{ matrix.version }})
    runs-on: [self-hosted, linux]
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        version: [us, jp_rev1]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        run: |
          rustc --version
          cargo --version
          clang --version
          python3 --version

      - name: Build (${{ matrix.version }})
        env:
          DW1_VERSION: ${{ matrix.version }}
        run: cargo build --workspace --release

      - name: Test (${{ matrix.version }})
        env:
          DW1_VERSION: ${{ matrix.version }}
        run: cargo test --workspace
