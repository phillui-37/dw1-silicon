name: build

# Runs on the project's own machine (a self-hosted Windows runner), not GitHub-hosted
# runners. The machine already carries the toolchain this project needs (rustup with the
# nightly pinned by rust-toolchain.toml, LLVM/clang on PATH, Python 3 with PyYAML, CMake),
# so the workflow does not install anything.
on:
  push:
    branches: [windows-port, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: windows (${{ matrix.version }})
    runs-on: [self-hosted, windows]
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        version: [us, jp_rev1]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        run: |
          rustc --version
          cargo --version
          clang --version
          python --version

      - name: Build (${{ matrix.version }})
        env:
          DW1_VERSION: ${{ matrix.version }}
        run: cargo build --workspace --release

      - name: Test (${{ matrix.version }})
        env:
          DW1_VERSION: ${{ matrix.version }}
        run: cargo test --workspace
