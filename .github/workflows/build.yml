name: build

# Runs on the project's own machine (a self-hosted Windows runner registered as
# "self-hosted"/"windows"), not on GitHub-hosted runners.
on:
  push:
    branches: [windows-port, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: windows (${{ matrix.version }})
    runs-on: [self-hosted, windows]
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        version: [us, jp_rev1]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Build (${{ matrix.version }})
        env:
          DW1_VERSION: ${{ matrix.version }}
        run: cargo build --workspace --release

      - name: Test (${{ matrix.version }})
        env:
          DW1_VERSION: ${{ matrix.version }}
        run: cargo test --workspace
