# One macOS deployment target for everything the build compiles (Rust, the game C, SDL3 through
# CMake): without it CMake builds SDL for the build machine's macOS while the binary says 11.0,
# so the app could refuse to run on an older Mac. 11.0 is the first macOS on Apple Silicon.
[env]
MACOSX_DEPLOYMENT_TARGET = "11.0"

# The overlay bounds are `__start_<section>`/`__stop_<section>`, which lld's --gc-sections
# would otherwise sweep away as "unused" (see https://lld.llvm.org/ELF/start-stop-gc).
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-z,nostart-stop-gc"]
