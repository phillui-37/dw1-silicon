[package]
name = "render"
description = "Shows the game's picture in the window with wgpu on Metal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["metal", "wgsl", "std"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "dx12", "wgsl", "std"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "wgsl", "std"] }
