[package]
name = "dw1"
description = "Digimon World as a native Apple Silicon app"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
backend = { version = "0.1.0", path = "../backend" }
decomp-c = { path = "../decomp-c" }
dirs = "5"
pack = { path = "../pack" }
png = "0.17"
psyq = { path = "../psyq" }
render = { path = "../render" }
sha1_smol = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sdl3 = { version = "0.20.0", default-features = false, features = ["build-from-source-static", "raw-window-handle"] }
